name: Pruebas automatizadas
on: [push, pull_request]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo_practica
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: demo_practica/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
